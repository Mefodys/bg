name: Visual regression
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  visual-regression:
    name: visual-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      options: --ipc=host
    env:
      VISUAL_CI_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      KOTLIN_VERSION: '2.4.20'
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VISUAL_PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: current
          fetch-depth: 0
      - name: Resolve exact previous revision
        working-directory: current
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            echo "BASE_SHA=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: previous
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: visual-konan-linux-x64-2.4.20
      - name: Install pinned native compiler
        shell: bash
        run: |
          set -euo pipefail
          compiler_dir="$HOME/.konan/kotlin-native-prebuilt-linux-x86_64-$KOTLIN_VERSION"
          if [ ! -x "$compiler_dir/bin/konanc" ]; then
            archive="kotlin-native-prebuilt-linux-x86_64-$KOTLIN_VERSION.tar.gz"
            base="https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN_VERSION"
            curl --fail --location --retry 3 "$base/$archive" -o "$RUNNER_TEMP/$archive"
            curl --fail --location --retry 3 "$base/$archive.sha256" -o "$RUNNER_TEMP/$archive.sha256"
            checksum="$(tr -d '[:space:]' < "$RUNNER_TEMP/$archive.sha256")"
            [[ "$checksum" =~ ^[0-9a-fA-F]{64}$ ]]
            echo "$checksum  $RUNNER_TEMP/$archive" | sha256sum -c -
            mkdir -p "$HOME/.konan"
            tar -xzf "$RUNNER_TEMP/$archive" -C "$HOME/.konan"
          fi
          echo "KONANC=$compiler_dir/bin/konanc" >> "$GITHUB_ENV"
      - name: Build previous and current native scanners from exact revisions
        run: |
          bash current/tests/visual/build-native-linux.sh previous
          bash current/tests/visual/build-native-linux.sh current
          previous/bg --version
          current/bg --version
      - name: Run native and HTTP behavior tests on Linux
        working-directory: current
        run: |
          checkout_owner="$(stat -c '%u:%g' .)"
          trap 'chown -R "$checkout_owner" .' EXIT
          chown -R pwuser:pwuser .
          runuser -u pwuser -- env "PATH=$PATH" python3 tests/run.py
      - name: Install locked browser test tools
        working-directory: current
        run: npm ci --ignore-scripts
      - name: Test regression classification
        working-directory: current
        run: python3 tests/visual/test_analysis.py
      - name: Retrieve previous accepted main screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 current/tests/visual/download-baseline.py "$REPOSITORY" "$BASE_SHA" previous-baseline
      - name: Playwright tests, deterministic repeats and previous/current analysis
        working-directory: current
        env:
          VISUAL_PREVIOUS_BASELINE: ../previous-baseline
        run: python3 tests/visual/ci.py ../previous . ../visual-artifacts
      # TEMPORARY review relay, removed before this PR is delivered. The review
      # sandbox cannot reach artifact blob storage, so the reviewed frames and
      # their exact hashes are relayed through the reachable job log. It only
      # reads what the analysis already produced and gates nothing.
      - name: Relay comparison data and reviewed frames to the job log
        if: always()
        run: |
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          root = Path('visual-artifacts')
          for name in ['comparison/comparison.json', 'head-2/manifest.json']:
              path = root / name
              print('<<<JSON ' + name + '>>> ' + (json.dumps(json.loads(path.read_text()), separators=(',', ':')) if path.exists() else 'MISSING'), flush=True)
          for png in sorted((root / 'head-2').rglob('*.png')):
              data = base64.b64encode(png.read_bytes()).decode()
              print('<<<PNG ' + png.relative_to(root / 'head-2').as_posix() + ' ' + str(len(data)) + '>>>', flush=True)
              for at in range(0, len(data), 180):
                  print('B64 ' + data[at:at+180], flush=True)
          print('<<<RELAY END>>>', flush=True)
          PY
      - name: Upload old, new, highlighted differences and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-comparison-${{ env.HEAD_SHA }}
          path: visual-artifacts/
          if-no-files-found: warn
          retention-days: 90
      - name: Report incomplete verification when setup or build failed
        if: failure()
        run: |
          if [ ! -f visual-artifacts/summary.md ]; then
            echo '::error title=INCOMPLETE VISUAL VERIFICATION::Setup, build or native tests failed before screenshot analysis.'
            echo '# INCOMPLETE VISUAL VERIFICATION' >> "$GITHUB_STEP_SUMMARY"
            echo 'Setup, build or native tests failed before screenshot analysis. Inspect the failed step; no visual baseline was accepted.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save accepted main screenshots for the next PR
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-${{ github.sha }}
          path: visual-artifacts/head-2/
          if-no-files-found: error
          retention-days: 90
